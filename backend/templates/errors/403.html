{% extends 'base.html' %}
{% block title %}403 Forbidden - Access Denied{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 80px auto; text-align: center;">
  <div class="card-saas" style="border-color: rgba(239, 68, 68, 0.4);">
    <div style="font-size: 64px; color: #ef4444; margin-bottom: 12px;"><i class="ph ph-shield-warning"></i></div>
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px;">403 - Access Forbidden</h1>
    <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px;">
      You do not possess the required RBAC role permissions to perform this operation or access this protected resource.
    </p>
    <a href="{% url 'dashboard' %}" class="btn-saas btn-primary-saas">
      <i class="ph ph-house"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
