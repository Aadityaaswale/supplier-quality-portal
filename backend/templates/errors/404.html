{% extends 'base.html' %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 80px auto; text-align: center;">
  <div class="card-saas">
    <div style="font-size: 64px; color: var(--primary); margin-bottom: 12px;"><i class="ph ph-magnifying-glass"></i></div>
    <h1 style="font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px;">404 - Record Not Found</h1>
    <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px;">
      The supplier, quality review record, or page you requested could not be located in the database.
    </p>
    <a href="{% url 'dashboard' %}" class="btn-saas btn-primary-saas">
      <i class="ph ph-house"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
