[portal_servers]
localhost ansible_connection=local

[staging]
staging.supplierportal.local ansible_host=127.0.0.1 ansible_port=2222

[production]
prod.supplierportal.local ansible_host=127.0.0.1 ansible_port=22

[portal_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=supplier-quality-portal
app_dir=/opt/supplier-quality-portal
deploy_user=deployer
http_port=80
backend_port=8000
